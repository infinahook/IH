[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.5.2"
edition = "2021"
rust-version = "1.82"
authors = ["IH contributors"]
repository = "https://github.com/infinahook/IH"

[workspace.dependencies]
# --- sérialisation / types de base ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
semver = { version = "1", features = ["serde"] }
hex = "0.4"

# --- journalisation ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "time"] }
tracing-appender = "0.2"

# --- persistance ---
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }

# --- réseau / HTTP ---
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
bytes = "1"

# --- cryptographie (vérification des mises à jour) ---
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"

# --- terminal / processus ---
portable-pty = "0.8"

# --- système ---
walkdir = "2"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# --- texte ---
regex = "1"

# --- Tauri ---
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
