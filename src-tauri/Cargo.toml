[package]
name = "ih-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
description = "IH — harness de développement IA pour Linux (Tauri)"

[[bin]]
name = "ih"
path = "src/main.rs"

[lib]
name = "ih_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
ih-core = { path = "../crates/ih-core" }
ih-i18n = { path = "../crates/ih-i18n" }
ih-store = { path = "../crates/ih-store" }
ih-security = { path = "../crates/ih-security" }
ih-providers = { path = "../crates/ih-providers" }
ih-chat = { path = "../crates/ih-chat" }
ih-context = { path = "../crates/ih-context" }
ih-agents = { path = "../crates/ih-agents" }
ih-agent-mode = { path = "../crates/ih-agent-mode" }
ih-extensions = { path = "../crates/ih-extensions" }
ih-workspace = { path = "../crates/ih-workspace" }
ih-orchestrator = { path = "../crates/ih-orchestrator" }
ih-update = { path = "../crates/ih-update" }

tauri.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
uuid.workspace = true
semver.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
