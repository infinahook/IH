name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Vérifications (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libssl-dev build-essential curl file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Installer les dépendances frontend
        run: npm ci --no-audit --no-fund

      - name: Formatage Rust
        run: cargo fmt --all -- --check

      # `generate_context!` embarque `dist/` : le frontend doit exister avant
      # toute compilation du crate Tauri (clippy et tests compris).
      - name: Build frontend
        run: npm run build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests Rust
        run: cargo test --workspace

      - name: Vérification de types frontend
        run: npm run typecheck

      - name: Tests frontend
        run: npm test --silent

  package:
    name: Paquets Linux (DEB + AppImage)
    runs-on: ubuntu-24.04
    needs: check
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            patchelf libssl-dev build-essential curl file

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --no-audit --no-fund

      - name: Construire les paquets
        run: npm run tauri build -- --bundles deb,appimage

      - name: Publier les paquets
        uses: actions/upload-artifact@v6
        with:
          name: ih-linux-packages
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Mettre à jour et installer les dépendances
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel rust git nodejs npm \
            webkit2gtk-4.1 gtk3 librsvg libsoup3 \
            openssl pkgconf curl file

      - uses: actions/checkout@v5

      - name: Dépendances frontend
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Tests Rust
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release --locked --manifest-path src-tauri/Cargo.toml

  sandbox:
    name: Sandbox réelle (bubblewrap)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Installer bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap build-essential pkg-config libssl-dev curl python3 file
          # Ubuntu 24.04 restreint les user namespaces non privilégiés
          # (AppArmor) : sans cela, même un bubblewrap installé ne peut pas
          # créer de sandbox. L'étape suivante échoue si ce n'est pas effectif.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Vérifier que bubblewrap isole réellement
        run: |
          set -euo pipefail
          bwrap --version
          canari="$(mktemp -d)/canari.txt"
          echo intact > "$canari"
          # 1. une sandbox minimale démarre ;
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
            --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp -- /bin/sh -c 'exit 0'
          # 2. et elle refuse réellement une écriture hors sandbox.
          if bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
            --symlink usr/bin /bin --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --proc /proc --dev /dev --tmpfs /tmp \
            -- /bin/sh -c "echo pirate > $canari"; then
            echo "ERREUR: la sandbox laisse écrire hors worktree" >&2
            exit 1
          fi
          grep -qx intact "$canari"
          echo "OK: user namespaces disponibles et sandbox effective"

      - name: Tests de sandbox réels
        env:
          IH_REQUIRE_SANDBOX: "1"
        run: |
          set -euo pipefail
          # Aucune sandbox indisponible ne doit devenir un succès : la variable
          # ci-dessus transforme l'absence de moteur en échec.
          cargo test -p ih-agents --lib
          cargo test -p ih-agents --test sandbox_runtime -- --ignored --test-threads=1
          cargo test -p ih-agents --test home_protection -- --ignored --test-threads=1
          cargo test -p ih-agents --test sandbox_git -- --ignored --test-threads=1
          cargo test -p ih-agent-mode --lib
